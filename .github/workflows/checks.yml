name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_public_tree.py
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install and negotiate MCP without UI actions
        shell: powershell
        run: ./install.ps1 -Dir "$env:RUNNER_TEMP\KudingDesktopMCP" -SelfTestWait 90
      - name: Check local-only diagnostics
        shell: powershell
        run: '& "$env:RUNNER_TEMP\KudingDesktopMCP\venv\Scripts\python.exe" -m unittest discover -s tests -v'
